<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FIMMUN 2026 - Observer Registration</title>
  <style>
    :root {
      --bg-color: #eef2ff;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary-blue: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #cbd5e1;
      --dark-card: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; max-width: 1200px; margin: 0 auto; }
    .brand { font-size: 1.25rem; font-weight: 700; color: #1e3a8a; }

    .container { max-width: 680px; margin: 20px auto; background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .form-header { text-align: center; margin-bottom: 25px; }
    .form-header h1 { font-size: 1.8rem; color: #0f172a; margin-bottom: 8px; }
    .form-header p { color: var(--text-muted); font-size: 0.95rem; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    label .req { color: #dc2626; }

    input[type="text"], input[type="email"], input[type="tel"] { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .sub-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    .fee-card { background-color: #f0f7ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .fee-amount { font-size: 1.5rem; font-weight: 700; color: #1e3a8a; }

    .bank-card { background-color: var(--dark-card); color: #ffffff; border-radius: 8px; padding: 20px; margin-bottom: 12px; }
    .bank-acc-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .account-num { font-family: monospace; font-size: 1.1rem; letter-spacing: 1px; }
    .btn-copy { background: #334155; color: #ffffff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }

    .file-input-wrapper { border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; }
    .btn-submit { width: 100%; background-color: var(--primary-blue); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-submit:hover { background-color: var(--primary-hover); }

    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .container { padding: 20px; } }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">FIMMUN 2026</div>
  </nav>

  <div class="container">
    <div class="form-header">
      <h1>Observer Registration</h1>
      <p>Register as an Observer for FIMMUN 2026</p>
    </div>

    <form id="observerForm">
      <div class="grid-2">
        <div class="form-group">
          <label>Full Name <span class="req">*</span></label>
          <input type="text" name="fullName" placeholder="Enter your full name" required />
        </div>
        <div class="form-group">
          <label>Email Address <span class="req">*</span></label>
          <input type="email" name="email" placeholder="Enter your email address" required />
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>WhatsApp Number <span class="req">*</span></label>
          <input type="tel" name="whatsapp" id="whatsapp" placeholder="03xx-xxxxxxx" maxlength="12" required />
          <div class="sub-text">Format: 03xx-xxxxxxx</div>
        </div>
        <div class="form-group">
          <label>CNIC <span class="req">*</span></label>
          <input type="text" name="cnic" id="cnic" placeholder="xxxxx-xxxxxxx-x" maxlength="15" required />
          <div class="sub-text">Format: xxxxx-xxxxxxx-x</div>
        </div>
      </div>

      <div class="form-group">
        <label>Current Institution <span class="req">*</span></label>
        <input type="text" name="institution" placeholder="Enter your school/college/university name" required />
      </div>

      <div class="fee-card">
        <div>
          <h3>Registration Fee</h3>
          <p>Observer Registration</p>
        </div>
        <div class="fee-amount">PKR 4,500</div>
      </div>

      <div class="bank-card">
        <label style="color:#94a3b8; font-size:0.8rem;">Bank Details for Payment</label>
        <h3 style="margin-bottom:8px;">FARZANA PERVEEN</h3>
        <div class="bank-acc-row">
          <span class="account-num" id="accNumber">01201003345332</span>
          <button type="button" class="btn-copy" onclick="copyAccount()">Copy</button>
        </div>
        <div style="color:#94a3b8; font-size:0.9rem;">Bank Alfalah</div>
      </div>

      <div class="form-group">
        <label>Payment Proof <span class="req">*</span></label>
        <div class="file-input-wrapper">
          <input type="file" id="paymentProof" accept=".jpg,.png,.jpeg,.pdf" required />
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Submit Observer Registration</button>
    </form>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx_fUdgM4xxwBEIKMIhO0K8yKx1wwprAcitquqROceeWyESUBaf17AI0TBscAwRm-3Irg/exec';

    // Auto-format WhatsApp: 03xx-xxxxxxx
    document.getElementById('whatsapp').addEventListener('input', function (e) {
      let x = e.target.value.replace(/\D/g, '').match(/(\d{0,4})(\d{0,7})/);
      e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2];
    });

    // Auto-format CNIC: xxxxx-xxxxxxx-x
    document.getElementById('cnic').addEventListener('input', function (e) {
      let x = e.target.value.replace(/\D/g, '').match(/(\d{0,5})(\d{0,7})(\d{0,1})/);
      e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2] + (x[3] ? '-' + x[3] : '');
    });

    function copyAccount() {
      navigator.clipboard.writeText(document.getElementById('accNumber').innerText);
      alert('Account number copied to clipboard!');
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    const form = document.getElementById('observerForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      try {
        const fileInput = document.getElementById('paymentProof').files[0];
        let fileData = null, fileName = '', fileMimeType = '';

        if (fileInput) {
          fileData = await fileToBase64(fileInput);
          fileName = fileInput.name;
          fileMimeType = fileInput.type;
        }

        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());
        payload.fileData = fileData;
        payload.fileName = fileName;
        payload.fileMimeType = fileMimeType;

        await fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('Observer Registration Submitted Successfully!');
        form.reset();
      } catch (error) {
        alert('An error occurred during submission. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Observer Registration';
      }
    });
  </script>
</body>
</html>
